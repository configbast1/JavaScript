<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>магазин товарів</title>

    <style>

        body{
            margin: 0;
            padding: 20px;
            background: #f5f5f5;
            font-family: Arial;
        }

        h1{
            text-align: center;
            margin-bottom: 30px;
        }

        .products{
            display: grid;

            grid-template-columns: repeat(5, 1fr);

            gap: 20px;
        }

        .card{
            background: white;

            border-radius: 15px;

            overflow: hidden;

            box-shadow: 0 0 10px rgba(0,0,0,0.2);

            transition: 0.3s;
        }

        .card:hover{
            transform: scale(1.03);
        }

        .card img{
            width: 100%;
            height: 220px;
            object-fit: cover;
        }

        .info{
            padding: 15px;
        }

        .title{
            font-size: 20px;
            margin-bottom: 10px;
            font-weight: bold;
        }

        .stars{
            color: orange;
            margin-bottom: 10px;
            font-size: 20px;
        }

        .oldPrice{
            text-decoration: line-through;
            color: gray;
            font-size: 18px;
        }

        .newPrice{
            color: red;
            font-size: 25px;
            font-weight: bold;
            margin-top: 5px;
            margin-bottom: 15px;
        }

        button{
            width: 100%;
            padding: 12px;

            border: none;

            background: #00a046;

            color: white;

            font-size: 18px;

            border-radius: 10px;

            cursor: pointer;
        }

        button:hover{
            background: #008a3d;
        }

        @media(max-width:1200px){

            .products{
                grid-template-columns: repeat(4,1fr);
            }

        }

        @media(max-width:900px){

            .products{
                grid-template-columns: repeat(3,1fr);
            }

        }

        @media(max-width:700px){

            .products{
                grid-template-columns: repeat(2,1fr);
            }

        }

        @media(max-width:500px){

            .products{
                grid-template-columns: repeat(1,1fr);
            }

        }

    </style>

</head>
<body>

<h1>Інтернет Магазин</h1>

<div class="products" id="products"></div>

<script>

    let products = document.getElementById("products");

    function createCard(image, title, stars, oldPrice, newPrice){

        let card = document.createElement("div");
        card.className = "card";

        let starsText = "";

        for(let i = 0; i < stars; i++){

            starsText += "★";

        }

        card.innerHTML = `
        
            <img src="${image}">
            
            <div class="info">

                <div class="title">${title}</div>

                <div class="stars">${starsText}</div>

                <div class="oldPrice">${oldPrice} ₴</div>

                <div class="newPrice">${newPrice} ₴</div>

                <button>Додати в кошик</button>

            </div>
        
        `;

        products.appendChild(card);

    }

    let images = [

        "https://picsum.photos/300/300?1",
        "https://picsum.photos/300/300?2",
        "https://picsum.photos/300/300?3",
        "https://picsum.photos/300/300?4",
        "https://picsum.photos/300/300?5"

    ];

    for(let i = 1; i <= 25; i++){

        createCard(

            images[i % 5],

            "Товар №" + i,

            Math.floor(Math.random() * 5) + 1,

            3000 + i * 100,

            2000 + i * 100

        );

    }

</script>

</body>
</html>
