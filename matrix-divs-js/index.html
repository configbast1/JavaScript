<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>матрицa div</title>

    <style>
        body {
            margin: 20px;
            font-family: Arial;
        }

        .container {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .row {
            display: flex;
            gap: 10px;
        }

        .box {
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 20px;
            font-weight: bold;
            border: 3px solid black;
        }
    </style>
</head>
<body>

<div class="container" id="container"></div>

<script>
    let rows = +prompt("Введіть кількість рядків:");
    let cols = +prompt("Введіть кількість стовпчиків:");

    let boxWidth = +prompt("Введіть ширину div:");
    let boxHeight = +prompt("Введіть висоту div:");

    let container = document.getElementById("container");

    function randomColor() {
        let r = Math.floor(Math.random() * 256);
        let g = Math.floor(Math.random() * 256);
        let b = Math.floor(Math.random() * 256);

        return `rgb(${r}, ${g}, ${b})`;
    }

    for (let i = 0; i < rows; i++) {

        let row = document.createElement("div");
        row.className = "row";

        for (let j = 0; j < cols; j++) {

            let div = document.createElement("div");
            div.className = "box";

            div.style.width = boxWidth + "px";
            div.style.height = boxHeight + "px";

            div.style.backgroundColor = randomColor();
            div.style.borderColor = randomColor();

            div.innerText = i + ":" + j;

            row.appendChild(div);
        }

        container.appendChild(row);
    }
</script>

</body>
</html>
